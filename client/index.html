<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://futurepath.ae/" />

    <!-- Title & SEO -->
    <title>Future Pathways – Career Guidance for Students</title>
    <meta name="description" content="Discover your ideal career with Future Pathways. Personalised career guidance for students aged 13–18, aligned with your country's vision and the jobs of tomorrow." />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://futurepath.ae/" />
    <meta property="og:title" content="Future Pathways – Career Guidance for Students" />
    <meta property="og:description" content="Personalised career guidance for students aged 13–18, aligned with your country's vision and the jobs of tomorrow." />
    <meta property="og:image" content="https://futurepath.ae/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Future Pathways — Career Guidance for Students" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Future Pathways" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@futurepathways" />
    <meta name="twitter:title" content="Future Pathways – Career Guidance for Students" />
    <meta name="twitter:description" content="Personalised career guidance for students aged 13–18, aligned with your country's vision and the jobs of tomorrow." />
    <meta name="twitter:image" content="https://futurepath.ae/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Future Pathways",
      "applicationCategory": "EducationApplication",
      "description": "Personalised career guidance for students aged 13–18, aligned with UAE 2030/2071 vision and the jobs of tomorrow.",
      "url": "https://futurepath.ae/",
      "inLanguage": "en",
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Google Fonts — non-blocking load (Poppins + Inter only).
         Cairo is served from /fonts/cairo/ (bundled locally in client/public/)
         via @font-face rules in index.css, so no CDN request is needed for it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded with media="print" so it doesn't block first paint; main.tsx flips
         media to 'all' once loaded. The flip lives in bundled JS (not an inline
         onload attribute) because CSP's script-src-attr 'none' blocks inline handlers. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap"
          rel="stylesheet"
          media="print"
          class="async-font" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
